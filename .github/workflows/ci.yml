
name: System Health Monitor CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest -v test_app.py

      - name: Build Docker image
        run: docker build -t system-health-monitor:ci .

      - name: Start Docker container
        run: docker run -d --name system-health-monitor -p 8000:8000 system-health-monitor:ci

      - name: Verify container health
        run: |
          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' system-health-monitor)

            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "missing" ]; then
              docker logs system-health-monitor
              exit 1
            fi

            sleep 2
          done

          docker logs system-health-monitor
          exit 1

      - name: Test live health endpoint
        run: |
          python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health').read().decode())"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/system-health-monitor
          tags: |
            type=raw,value=latest
            type=sha

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Clean up container
        if: always()
        run: docker rm -f system-health-monitor || true

  deploy-to-aws:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS Lightsail
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Deployment failed at line $LINENO (exit code $rc)"' ERR

          : "${AWS_HOST:?AWS_HOST secret is missing}"
          : "${AWS_USER:?AWS_USER secret is missing}"
          : "${AWS_SSH_KEY:?AWS_SSH_KEY secret is missing}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Checking SSH host..."
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "Connecting to AWS and deploying..."
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$AWS_USER@$AWS_HOST" 'bash -s' <<'REMOTE'
              set -Eeuo pipefail
              trap 'rc=$?; echo "Remote deployment failed at line $LINENO (exit code $rc)"' ERR

              IMAGE="ghcr.io/sangamesh-19/system-health-monitor:latest"
              CONTAINER="system-health-monitor"

              echo "Pulling Docker image..."
              sudo docker pull "$IMAGE"

              echo "Replacing container..."
              sudo docker rm -f "$CONTAINER" || true

              sudo docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                -p 127.0.0.1:8000:8000 \
                "$IMAGE"

              echo "Waiting for container health..."
              HEALTHY=false

              for i in $(seq 1 15); do
                STATUS=$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$CONTAINER")

                if [ "$STATUS" = "healthy" ]; then
                  echo "Container is healthy"
                  HEALTHY=true
                  break
                fi

                if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "missing" ]; then
                  echo "Container health check failed: $STATUS"
                  sudo docker logs "$CONTAINER"
                  exit 1
                fi

                sleep 2
              done

              if [ "$HEALTHY" != "true" ]; then
                echo "Container did not become healthy in time"
                sudo docker inspect "$CONTAINER"
                sudo docker logs "$CONTAINER"
                exit 1
              fi

              echo "Checking local health endpoint..."
              curl --fail --silent --show-error http://127.0.0.1:8000/health
              echo
              echo "AWS deployment completed successfully"
          REMOTE
