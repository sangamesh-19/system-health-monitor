
name: System Health Monitor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest -v test_app.py

      - name: Build Docker image
        run: docker build -t system-health-monitor:ci .

      - name: Start Docker container
        run: docker run -d --name system-health-monitor -p 8000:8000 system-health-monitor:ci

      - name: Verify container health
        run: |
          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' system-health-monitor)
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              docker logs system-health-monitor
              exit 1
            fi
            sleep 2
          done
          docker logs system-health-monitor
          exit 1

      - name: Test live health endpoint
        run: |
          python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health').read().decode())"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/system-health-monitor
          tags: |
            type=raw,value=latest
            type=sha

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Clean up container
        if: always()
        run: docker rm -f system-health-monitor || true
